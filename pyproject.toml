[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vengeance-soundboard"
version = "0.1.0"
description = "Soundboard GTK 4 avec catalogue Freesound et routage PipeWire vers Discord"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.46", "requests>=2.31"]

[project.scripts]
vengeance-soundboard = "vengeance_soundboard.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
